apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/name: secret-sync-operator
    app.kubernetes.io/managed-by: kustomize
  name: secret-sync-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-sync-operator
  namespace: secret-sync-system
  labels:
    control-plane: secret-sync-operator
    app.kubernetes.io/name: secret-sync-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: secret-sync-operator
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: secret-sync-operator
    spec:
      serviceAccountName: secret-sync-operator
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          # Replaced with a published image by "make deploy" or kustomize images.
          image: controller:latest
          imagePullPolicy: IfNotPresent
          args:
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=0
            - --leader-elect
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL